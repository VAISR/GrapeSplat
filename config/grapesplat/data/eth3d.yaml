# GrapeSplat DataModule configuration
# Variant: ETH3D

defaults:
    - default
    - _self_

dataset:
    - _target_: grapesplat.data.eth3d.ETH3DDatasetBuilder
      filter:
          _target_: grapesplat.data.eth3d.ETH3DFilterBuilder
          seq_len_min: 14
          split_path: .data/eth3d/split.jgz
          split_size_test: 13
          split_size_train: 0
          split_size_val: 0
      root_path: .shared/datasets/ETH3D
      weight_test: 1
      weight_train: 0
