# GrapeSplat DataModule configuration
# Variant: NRGBD

defaults:
    - default
    - _self_

dataset:
    - _target_: grapesplat.data.nrgbd.NRGBDDatasetBuilder
      filter:
          _target_: grapesplat.data.nrgbd.NRGBDFilterBuilder
          seq_len_min: 300
          split_path: .data/nrgbd/split.jgz
          split_size_test: 9
          split_size_train: 0
          split_size_val: 0
      root_path: .shared/datasets/NRGBD
      weight_test: 1
      weight_train: 0
